name: 更新北林教务 RSS

on:
  push:
    paths:
      - '.github/workflows/bjfu-jwc-rss.yml'
      - 'bjfu-jwc/scripts/build-feed.mjs'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 生成订阅源
        run: node bjfu-jwc/scripts/build-feed.mjs
      - name: 保存更新
        run: |
          if git diff --quiet -- bjfu-jwc/rss.xml; then
            echo '没有新公告'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bjfu-jwc/rss.xml
          git commit -m '更新北林教务 RSS'
          git push
          curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
        env:
          GITHUB_TOKEN: ${{ github.token }}
